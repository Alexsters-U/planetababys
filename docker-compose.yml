name: planetababys
x-backend-env: &backend-env
  NODE_ENV: production
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql://${POSTGRES_USER:-planetababys}:${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-planetababys}?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD:?Configura REDIS_PASSWORD}@redis:6379
  JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET}
  SESSION_SECRET: ${SESSION_SECRET:?Configura SESSION_SECRET}
  SITE_URL: ${SITE_URL:-http://localhost:3000}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  PAYMENT_MODE: ${PAYMENT_MODE:-wompi}
  WOMPI_ENV: ${WOMPI_ENV:-test}
  WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY:-}
  WOMPI_PRIVATE_KEY: ${WOMPI_PRIVATE_KEY:-}
  WOMPI_INTEGRITY_KEY: ${WOMPI_INTEGRITY_KEY:-}
  WOMPI_EVENTS_KEY: ${WOMPI_EVENTS_KEY:-}
  SHIPPING_CENTS: ${SHIPPING_CENTS:-0}
  SHIPPING_MODE: ${SHIPPING_MODE:-quote}
  SHIPPING_CONFIGURED: ${SHIPPING_CONFIGURED:-false}
  SHIPPING_ALLOWED_CITIES: ${SHIPPING_ALLOWED_CITIES:-}
  STORE_LEGAL_NAME: ${STORE_LEGAL_NAME:-}
  STORE_TAX_ID: ${STORE_TAX_ID:-}
  STORE_ADDRESS: ${STORE_ADDRESS:-}
  STORE_CONTACT_EMAIL: ${STORE_CONTACT_EMAIL:-}
  STORE_CONTACT_PHONE: ${STORE_CONTACT_PHONE:-}
  UPLOAD_DIR: /app/uploads
  PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:?Configura PROXY_SHARED_SECRET}
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-planetababys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-planetababys}
    volumes: [db-data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-planetababys} -d ${POSTGRES_DB:-planetababys}"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Configura REDIS_PASSWORD}
    command: ["sh","-c","exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes: [redis-data:/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL","REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: {context: ., dockerfile: backend/Dockerfile, target: tools}
    environment:
      <<: *backend-env
    depends_on:
      db: {condition: service_healthy}
    networks: [data]
    restart: "no"
  backend:
    build: {context: ., dockerfile: backend/Dockerfile, target: runner}
    environment:
      <<: *backend-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
    volumes: [uploads:/app/uploads]
    networks: [web, data, egress]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
  frontend:
    build: {context: ., dockerfile: Dockerfile}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://backend:4000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:?Configura PROXY_SHARED_SECRET}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      INDEXING_ENABLED: ${INDEXING_ENABLED:-false}
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    ports: ["127.0.0.1:${APP_PORT:-3000}:3000"]
    networks: [web, egress]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  seed:
    profiles: [tools]
    build: {context: ., dockerfile: backend/Dockerfile, target: tools}
    command: ["pnpm","db:seed"]
    environment:
      <<: *backend-env
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?Configura SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Configura SEED_ADMIN_PASSWORD}
      SEED_DEMO_CATALOG: ${SEED_DEMO_CATALOG:-false}
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [data]
networks:
  web: {internal: true}
  data: {internal: true}
  egress: {}
volumes:
  db-data:
  redis-data:
  uploads:
